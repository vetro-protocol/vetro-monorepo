specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: VeVetro
    network: hemi
    source:
      abi: VeVetro
      # TODO: Replace with the actual deployed address of the contract
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - PositionTransfer
        - VeVetroPosition
      abis:
        - name: VeVetro
          file: ./abis/VeVetro.json
      eventHandlers:
        - event: Deposit(indexed address,indexed uint256,uint256,uint256,uint256)
          handler: handleDeposit
        - event: Lock(indexed address,indexed address,indexed
            uint256,uint256,uint256,uint256,uint256,bool,bool)
          handler: handleLock
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
        - event: Withdraw(indexed address,indexed uint256,uint256,uint256)
          handler: handleWithdraw
      file: ./src/mappings/veVetro.ts
  - kind: ethereum
    name: VeVetroDistributor
    network: hemi
    source:
      abi: VeVetroDistributor
      # TODO: Replace with the actual deployed address of the contract
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Claim
        - ClaimedVeHemiPosition
        - PendingClaim
        - VeVetroPosition
      abis:
        - name: VeVetroDistributor
          file: ./abis/VeVetroDistributor.json
      eventHandlers:
        - event: Claimed(indexed address,indexed address,uint256,indexed uint256)
          handler: handleClaimed
        - event: PositionClaimed(indexed uint256,indexed address,uint8,uint256,uint256)
          handler: handlePositionClaimed
      file: ./src/mappings/veVetroDistributor.ts
