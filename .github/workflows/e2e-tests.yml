# Kept as its own workflow, intentionally separate from js-checks, so it is NOT
# part of the branch's required status checks while the e2e tests may still be
# flaky. Once they prove stable, we may add "E2E Tests" to the required checks, or merge
# with js-checks
name: E2E Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-cli-e2e-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hemilabs/actions/setup-node-env@34879d59453841c18fd53190b39251a5c566f8db # v3.0.0
        with:
          package-manager: pnpm
      - run: pnpm --filter @vetro-protocol/cli run test:e2e
        env:
          FORK_URL: ${{ secrets.INFURA_API }} # zizmor: ignore[secrets-outside-env] -- TODO: move INFURA_API to an environment
    timeout-minutes: 5
  run-web-e2e-tests:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hemilabs/actions/setup-node-env@34879d59453841c18fd53190b39251a5c566f8db # v3.0.0
        with:
          package-manager: pnpm
      - run: pnpm --filter @vetro-protocol/web exec playwright install chromium --only-shell
        env:
          DEBUG: pw:install
      - run: pnpm --filter @vetro-protocol/web exec playwright test
        env:
          DEBUG: pw:webserver
          VITE_RPC_URL_MAINNET: ${{ secrets.INFURA_API }} # zizmor: ignore[secrets-outside-env] -- TODO: move INFURA_API to an environment
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 5
    timeout-minutes: 10
