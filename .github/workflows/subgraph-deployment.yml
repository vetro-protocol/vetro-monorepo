name: Subgraph Deployment

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  deploy-vetro-app-subgraph:
    permissions:
      contents: read
    if: startsWith(github.event.release.tag_name, 'vetro-app-subgraph@')
    runs-on: ubuntu-26.04
    environment: release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: hemilabs/actions/setup-node-env@8f87619b7f0122c39e14a32514ab3e4e0d4c3966 # v2.3.0
        with:
          package-manager: pnpm
      - run: pnpm run deploy
        working-directory: subgraphs/vetro-app-subgraph
        env:
          GRAPH_API_KEY: ${{ secrets.GRAPH_API_KEY }}
  deploy-ve-vetro-subgraph:
    permissions:
      contents: read
    if: startsWith(github.event.release.tag_name, 've-vetro-subgraph@')
    runs-on: ubuntu-26.04
    environment: release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: hemilabs/actions/setup-node-env@8f87619b7f0122c39e14a32514ab3e4e0d4c3966 # v2.3.0
        with:
          package-manager: pnpm
      - run: pnpm run deploy
        working-directory: subgraphs/ve-vetro-subgraph
        env:
          GRAPH_API_KEY: ${{ secrets.GRAPH_API_KEY }}
