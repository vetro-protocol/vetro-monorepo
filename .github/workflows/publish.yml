name: Publish to npm

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    permissions:
      contents: read
      id-token: write # for npm provenance
    # Once target-yield-earn package is ready to be published,
    # add || startsWith(github.event.release.tag_name, 'target-yield-earn@')  below
    if: |
      startsWith(github.event.release.tag_name, 'bridge@')
      || startsWith(github.event.release.tag_name, 'cli@')
      || startsWith(github.event.release.tag_name, 'earn@')
      || startsWith(github.event.release.tag_name, 'gateway@')
      || startsWith(github.event.release.tag_name, 'hemi-earn@')
      || startsWith(github.event.release.tag_name, 'treasury@')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hemilabs/actions/setup-node-env@34879d59453841c18fd53190b39251a5c566f8db # v3.0.0
        with:
          package-manager: pnpm
      - name: Publish package
        run: ./scripts/publish-package.sh "${TAG%@*}" "${TAG#*@}"
        env:
          TAG: ${{ github.event.release.tag_name }}
